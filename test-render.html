<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
  <script src="http://localhost:3000/@vite/client" type="module"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    console.log('Test script loaded');
    try {
      import('./src/main.tsx').then(() => {
        console.log('App loaded successfully');
      }).catch(err => {
        console.error('Error loading app:', err);
        document.body.innerHTML += '<h1>Error: ' + err.message + '</h1>';
      });
    } catch(e) {
      console.error('Error:', e);
      document.body.innerHTML += '<h1>Error: ' + e.message + '</h1>';
    }
  </script>
</body>
</html>
